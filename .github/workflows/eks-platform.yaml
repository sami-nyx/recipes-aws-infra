name: EKS Platform Offline Testing

on:
  push:
    paths:
      - 'terraform/eks-platform/**'
  workflow_dispatch: 
jobs:
  
  ci-validate-plan:
    permissions:
      id-token: write  
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-offline-test
        with:
          path: ./terraform/eks-platform


      - name: Configure AWS Credentials via OIDC for ECR image push
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b #v6.2.0
        with:
          role-to-assume: arn:aws:iam::889867978066:role/github-actions-terraform
          aws-region: ap-south-1 
          disable-retry: true
      - name: TF init
        working-directory: ./terraform/eks-platform
        run: terraform init
      - name: Plan
        run: terraform plan