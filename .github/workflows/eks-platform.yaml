name: EKS Platform Offline Testing

on:
  push:
    paths:
      - 'terraform/eks-platform/**'
  workflow_dispatch: 
jobs:
  
  ci-validate-plan:
    permissions:
      id-token: write  
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-offline-test
        with:
          path: ./terraform/eks-platform


      