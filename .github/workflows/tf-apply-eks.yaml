name: Apply Terraform EKS Cluster


on:
  push:
    paths:
      - 'terraform/eks-platform/**'
  workflow_dispatch: 
  
jobs:
  
  tf-apply-eks:
    outputs:
      cluster_name: ${{ steps.terraform-outputs.outputs.cluster_name }}
      cluster_region: ${{ steps.terraform-outputs.outputs.cluster_region }}
      external_secrets_role_arn: ${{ steps.terraform-outputs.outputs.external_secrets_role_arn }}
      eks_created: ${{ steps.terraform-outputs.outputs.EKS_CREATED }}
    runs-on: self-hosted
    environment: staging
    permissions:
      id-token: write  
      contents: write
    steps:
    
    - uses: actions/checkout@v4
    
    - uses: hashicorp/setup-terraform@v3
    - name: Debug GitHub OIDC context
      run: |
        echo "Repository: $GITHUB_REPOSITORY"
        echo "Ref:        $GITHUB_REF"
        echo "Branch:     $GITHUB_REF_NAME"
        echo "Workflow:   $GITHUB_WORKFLOW"
        echo "Actor:      $GITHUB_ACTOR"
        echo "Event:      $GITHUB_EVENT_NAME"
        echo "Environment: staging"
    - name: Configure AWS Credentials via OIDC for ECR image push
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b #v6.2.0
      with:
        role-to-assume: arn:aws:iam::889867978066:role/github-actions-terraform
        aws-region: ap-south-1 
        disable-retry: true
    
    
    - name: Generate Terraform variables
      working-directory: ./terraform/eks-platform
      env:
        OWNER: ${{ vars.OWNER }}
        MANAGED_BY: ${{ vars.MANAGED_BY }}
        USAGE: ${{ vars.USAGE }}
        APP_NAME: ${{ vars.APP_NAME }}

        REGION: ${{ vars.REGION }}
        VPC_CIDRS: ${{ vars.VPC_CIDRS }}

        HA: ${{ vars.HA }}
        NODES_IN_PUBLIC: ${{ vars.NODES_IN_PUBLIC }}

        NODE_MIN: ${{ vars.NODE_MIN }}
        NODE_DESIRED: ${{ vars.NODE_DESIRED }}
        NODE_MAX: ${{ vars.NODE_MAX }}

        NODE_TYPE: ${{ vars.NODE_TYPE }}
        ENVIRONMENT: staging

      run: |
        envsubst < terraform.tfvars.template > terraform.tfvars
    - name: cat terraform.tfvars
      working-directory: ./terraform/eks-platform
      run: cat terraform.tfvars

    - name: Terraform Init
      working-directory: ./terraform/eks-platform
      run: terraform init -input=false

    - name: Terraform Plan
      working-directory: ./terraform/eks-platform
      run: terraform plan -input=false -out=tfplan
    
    - name: Terraform Apply
      working-directory: ./terraform/eks-platform
      run: terraform apply -input=false tfplan
    
    - name: Convert Terraform plan to JSON
      working-directory: ./terraform/eks-platform
      run: terraform show -json tfplan > tfplan.json

    - name: Detect EKS cluster creation
      id: detect-eks
      working-directory: ./terraform/eks-platform
      run: |
        EKS_CREATED=$(jq -r '
          [
            .resource_changes[]?
            | select(.type == "aws_eks_cluster")
            | select(.change.actions | index("create"))
          ] | length
        ' tfplan.json)

        if [ "$EKS_CREATED" -gt 0 ]; then
          echo "EKS_CREATED=true" >> "$GITHUB_OUTPUT"
          echo "EKS cluster will be created."
        else
          echo "EKS_CREATED=false" >> "$GITHUB_OUTPUT"
          echo "No EKS cluster creation detected."
        fi

    - name: Export bootstrap outputs
      id: terraform-outputs
      working-directory: ./terraform/eks-platform
      run: |
        {
          echo "cluster_name=$(terraform output -raw cluster_name)"
          echo "cluster_region=$(terraform output -raw cluster_region)"
          echo "external_secrets_role_arn=$(terraform output -raw external_secrets_role_arn)"
        } >> "$GITHUB_OUTPUT"

  bootstrap-cluster:
    name: Bootstrap Kubernetes Platform
    runs-on: ubuntu-24.04
    needs: tf-apply-eks
    environment: staging

    permissions:
      id-token: write
      contents: read
    steps:

      - uses: actions/checkout@v4
        with:
          repository: sami-nyx/recipes-gitops
          token: ${{ secrets.RECIPES_GITOPS_PAT }}
          path: gitops
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::889867978066:role/github-actions-bootstrap
          aws-region: ${{ needs.tf-apply-eks.outputs.cluster_region }}
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Run bootstrap
        working-directory: ./gitops/bootstrap
        env:
          CLUSTER_NAME: ${{ needs.tf-apply-eks.outputs.cluster_name }}
          CLUSTER_REGION: ${{ needs.tf-apply-eks.outputs.cluster_region }}
          EXTERNAL_SECRETS_ROLE_ARN: ${{ needs.tf-apply-eks.outputs.external_secrets_role_arn }}
          GITOPS_REPO_URL: "https://github.com/sami-nyx/recipes-gitops.git"
        run: |
          echo "cluster_name:$CLUSTER_NAME"
          echo "cluster_region:$CLUSTER_REGION"
          echo "external_secrets_role_ARN:$EXTERNAL_SECRETS_ROLE_ARN"
          echo "cluster_repo:$GITOPS_REPO_URL"
          
          ./bootstrap.sh