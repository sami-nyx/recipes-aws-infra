name: Apply Terraform EKS Cluster

on:
  workflow_dispatch:
    inputs:
      confirm_rebootstrap:
        description: "Cluster is already bootstrapped and I intentionally want to re-run bootstrap.sh against it"
        type: boolean
        required: false
        default: false

concurrency:
  group: staging-terraform-apply
  cancel-in-progress: false

jobs:

  notify-start:
    name: Notify Slack - Start
    runs-on: ubuntu-22.04
    environment: staging

    permissions:
      contents: read

    steps:
      - name: Send start notification
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":rocket: *Staging infrastructure deployment started*"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":rocket: *Staging infrastructure deployment started*\n*Repository:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Actor:* `${{ github.actor }}`\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View GitHub Actions>"
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-22.04
    environment: staging

    permissions:
      id-token: write
      contents: read

    outputs:
      cluster_name: ${{ steps.terraform-outputs.outputs.cluster_name }}
      cluster_region: ${{ steps.terraform-outputs.outputs.cluster_region }}
      external_secrets_role_arn: ${{ steps.terraform-outputs.outputs.external_secrets_role_arn }}
      cert_manager_route53_role_arn: ${{ steps.terraform-outputs.outputs.cert_manager_route53_role_arn }}
      cloudfront_sync_role_arn: ${{ steps.terraform-outputs.outputs.cloudfront_sync_role_arn }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1
          disable-retry: true

      - name: Generate Terraform variables
        working-directory: ./terraform/eks-platform
        env:
          OWNER: ${{ vars.OWNER }}
          MANAGED_BY: ${{ vars.MANAGED_BY }}
          USAGE: ${{ vars.USAGE }}
          APP_NAME: ${{ vars.APP_NAME }}

          REGION: ${{ vars.REGION }}
          VPC_CIDRS: ${{ vars.VPC_CIDRS }}

          HA: ${{ vars.HA }}
          NODES_IN_PUBLIC: ${{ vars.NODES_IN_PUBLIC }}

          NODE_MIN: ${{ vars.NODE_MIN }}
          NODE_DESIRED: ${{ vars.NODE_DESIRED }}
          NODE_MAX: ${{ vars.NODE_MAX }}

          NODE_TYPE: ${{ vars.NODE_TYPE }}
          ENVIRONMENT: staging

          PRINCIPAL_ARN: ${{ secrets.PRINCIPAL_ARN }}
          BOOTSTRAP_ARN: ${{ secrets.BOOTSTRAP_ARN }}
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

        run: |
          envsubst < terraform.tfvars.template > terraform.tfvars

      - name: Terraform Init
        working-directory: ./terraform/eks-platform
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ./terraform/eks-platform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform/eks-platform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform/eks-platform
        run: terraform apply -input=false tfplan

      - name: Export Terraform outputs
        id: terraform-outputs
        working-directory: ./terraform/eks-platform
        run: |
          {
            echo "cluster_name=$(terraform output -raw cluster_name)"
            echo "cluster_region=$(terraform output -raw cluster_region)"
            echo "external_secrets_role_arn=$(terraform output -raw external_secrets_role_arn)"
            echo "cert_manager_route53_role_arn=$(terraform output -raw cert_manager_route53_role_arn)"
            echo "cloudfront_sync_role_arn=$(terraform output -raw cloudfront_sync_role_arn)"
          } >> "$GITHUB_OUTPUT"

  sync-cert-issuer-config:
    name: Sync Route53 zone ID + cert-manager role ARN to recipes-gitops
    runs-on: ubuntu-22.04
    needs: terraform-apply
    environment: staging

    # Writes straight to recipes-gitops's main - deliberately, not a
    # PR. Neither value is sensitive (see recipes-gitops's readme.md):
    # a Route53 hosted zone ID and an IAM role ARN are resource
    # identifiers, not credentials - knowing either grants no access on
    # its own. This repo's PAT already reaches into recipes-gitops
    # (bootstrap-cluster, below, already checks it out); this job needs
    # that same PAT to also have write access, since it's the one thing
    # in this pipeline that actually knows these two values without a
    # human retyping them every apply cycle (the role ARN gets a new
    # random IAM name_prefix suffix every apply, not just once).
    permissions:
      contents: read

    steps:

      - name: Checkout GitOps repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sami-nyx/recipes-gitops
          token: ${{ secrets.RECIPES_GITOPS_PAT }}
          path: gitops

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Inject Route53 zone ID, region, email, and cert-manager role ARN
        working-directory: ./gitops
        env:
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}
          REGION: ${{ vars.REGION }}
          EMAIL: ${{ vars.EMAIL }}
          CERT_MANAGER_ROUTE53_ROLE_ARN: ${{ needs.terraform-apply.outputs.cert_manager_route53_role_arn }}
        run: |
          yq eval '.route53ZoneId = strenv(ROUTE53_ZONE_ID) | .region = strenv(REGION) | .email = strenv(EMAIL)' -i apps/cert-issuer/values.yaml
          yq eval '.spec.source.helm.values |= (from_yaml | .serviceAccount.annotations["eks.amazonaws.com/role-arn"] = strenv(CERT_MANAGER_ROUTE53_ROLE_ARN) | to_yaml)' -i argocd/applications/platform/cert-manager.yaml

      - name: Commit and push if changed
        working-directory: ./gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes - values already up to date."
            exit 0
          fi

          git add apps/cert-issuer/values.yaml argocd/applications/platform/cert-manager.yaml
          git commit -m "chore: sync Route53 zone ID + cert-manager role ARN from terraform apply

          Automated - recipes-aws-infra's tf-apply-eks.yaml, run ${{ github.run_id }}.
          Neither value is sensitive (see this repo's readme.md) - the
          role ARN changes on every apply (random IAM name_prefix
          suffix), the zone ID is stable but kept in sync from the same
          source of truth regardless."
          git push

  sync-cloudfront-config:
    name: Sync CloudFront distribution ID + cloudfront-sync role ARN to recipes-gitops
    runs-on: ubuntu-22.04
    # Sequenced after sync-cert-issuer-config, not parallel with it -
    # both jobs check out recipes-gitops independently and push straight
    # to its main. Running them at the same time meant whichever pushed
    # second got a non-fast-forward rejection ("cannot lock ref ... is
    # at X but expected Y"), since its checkout was already behind by
    # the time it tried to push.
    needs:
      - terraform-apply
      - sync-cert-issuer-config
    environment: staging

    # Same reasoning as sync-cert-issuer-config above: neither value is
    # sensitive (a CloudFront distribution ID and an IAM role ARN are
    # resource identifiers, not credentials), and the role ARN gets a
    # new random IAM name_prefix suffix every apply - not a one-time
    # value a human could just type in once and forget.
    permissions:
      contents: read

    steps:

      - name: Checkout GitOps repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sami-nyx/recipes-gitops
          token: ${{ secrets.RECIPES_GITOPS_PAT }}
          path: gitops

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Inject CloudFront distribution ID and cloudfront-sync role ARN
        working-directory: ./gitops
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CLOUDFRONT_SYNC_ROLE_ARN: ${{ needs.terraform-apply.outputs.cloudfront_sync_role_arn }}
        run: |
          yq eval '.distributionId = strenv(CLOUDFRONT_DISTRIBUTION_ID) | .roleArn = strenv(CLOUDFRONT_SYNC_ROLE_ARN)' -i apps/cloudfront-sync/values.yaml

      - name: Commit and push if changed
        working-directory: ./gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes - values already up to date."
            exit 0
          fi

          git add apps/cloudfront-sync/values.yaml
          git commit -m "chore: sync CloudFront distribution ID + cloudfront-sync role ARN from terraform apply

          Automated - recipes-aws-infra's tf-apply-eks.yaml, run ${{ github.run_id }}.
          Neither value is sensitive (see this repo's readme.md) - the
          role ARN changes on every apply (random IAM name_prefix
          suffix), the distribution ID is stable but kept in sync from
          the same source of truth regardless."
          git push

  bootstrap-cluster:
    name: Bootstrap Kubernetes Platform
    runs-on: ubuntu-24.04
    # Must wait for both sync-*-config jobs, not just terraform-apply -
    # this is what applies root-app.yaml, and Argo CD starts syncing
    # every Application (cert-manager, cloudfront-sync, ...) against
    # whatever is on recipes-gitops's main branch at that exact moment.
    # Racing ahead of the sync jobs bakes their still-unsynced
    # REPLACE_ME_* placeholders into IRSA env vars at pod-admission time
    # (the pod-identity webhook only injects once, at admission - a
    # ServiceAccount annotation corrected afterward doesn't retroactively
    # fix an already-running pod), which is exactly what broke
    # cert-manager's Route53 DNS-01 solver on a real run: the role ARN
    # wasn't synced yet when cert-manager's pod was created, so every
    # DNS-01 call failed with STS: "Request ARN is invalid" - nginx-ingress
    # served its self-signed fallback cert, and CloudFront's origin TLS
    # handshake failed with a 502 for as long as the cluster lived.
    needs:
      - terraform-apply
      - sync-cert-issuer-config
      - sync-cloudfront-config
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout GitOps repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sami-nyx/recipes-gitops
          token: ${{ secrets.RECIPES_GITOPS_PAT }}
          path: gitops

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          # Same ARN as bootstrap_role_arn in terraform.tfvars (that's the
          # role Terraform grants an EKS access entry to) - reused here
          # instead of a second secret for the same value.
          role-to-assume: ${{ secrets.BOOTSTRAP_ARN }}
          aws-region: ${{ needs.terraform-apply.outputs.cluster_region }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: latest

      - name: Setup Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: latest

      - name: Bootstrap cluster
        working-directory: ./gitops/bootstrap
        env:
          CLUSTER_NAME: ${{ needs.terraform-apply.outputs.cluster_name }}
          CLUSTER_REGION: ${{ needs.terraform-apply.outputs.cluster_region }}
          EXTERNAL_SECRETS_ROLE_ARN: ${{ needs.terraform-apply.outputs.external_secrets_role_arn }}
          GITOPS_REPO_URL: https://github.com/sami-nyx/recipes-gitops.git
          CONFIRM_REBOOTSTRAP: ${{ github.event.inputs.confirm_rebootstrap }}
        run: ./bootstrap.sh

  notify-success:
    name: Notify Slack - Success
    runs-on: ubuntu-22.04
    needs:
      - terraform-apply
      - sync-cert-issuer-config
      - sync-cloudfront-config
      - bootstrap-cluster
    if: ${{ success() }}
    environment: staging

    permissions:
      contents: read

    steps:
      - name: Send success notification
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":white_check_mark: *Staging infrastructure deployment succeeded*"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":white_check_mark: *Staging infrastructure deployment succeeded*\n*Repository:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Cluster:* `${{ needs.terraform-apply.outputs.cluster_name }}`\n*Region:* `${{ needs.terraform-apply.outputs.cluster_region }}`\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View GitHub Actions>"

  notify-failure:
    name: Notify Slack - Failure
    runs-on: ubuntu-22.04
    needs:
      - terraform-apply
      - sync-cert-issuer-config
      - sync-cloudfront-config
      - bootstrap-cluster
    if: ${{ failure() }}
    environment: staging

    permissions:
      contents: read

    steps:
      - name: Send failure notification
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":x: *Staging infrastructure deployment failed*"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":x: *Staging infrastructure deployment failed*\n*Repository:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View GitHub Actions>"