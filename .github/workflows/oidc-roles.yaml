name: OIDC Roles Offline Testing
on:
  # PR-only, deliberately - every change reaching main goes through a PR,
  # which is what actually validates it. No separate push trigger to keep
  # in sync with that.
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/oidc-roles/**'

jobs:
  ci-validate-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/tf-offline-test
        with:
          path: ./terraform/oidc-roles

      