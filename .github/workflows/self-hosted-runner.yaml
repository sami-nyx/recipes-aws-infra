name: Self Hosted Runner Offline Testing

on:
  push:
    paths:
      - 'terraform/self-hosted-runner/**'

jobs:
  ci-validate-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-offline-test
        with:
          path: ./terraform/self-hosted-runner